name: Publish plugin release

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^ \* Version:[[:space:]]*//p' jobayer-ai-agent.php | head -n1 | tr -d '\r')
          if [[ -z "$VERSION" ]]; then
            echo "Could not read plugin version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stop if this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build WordPress plugin ZIP
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          rm -rf build
          mkdir -p build/jobayer-ai-agent
          rsync -a ./ build/jobayer-ai-agent/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '*.zip'
          cd build
          zip -qr jobayer-ai-agent.zip jobayer-ai-agent

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" \
            build/jobayer-ai-agent.zip \
            --target "$GITHUB_SHA" \
            --title "Jobayer AI Agent $VERSION" \
            --generate-notes
