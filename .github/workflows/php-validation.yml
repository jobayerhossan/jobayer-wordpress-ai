name: Jobayer Agent PHP Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Lint plugin PHP sources
        run: find . -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l
